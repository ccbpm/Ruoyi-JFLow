<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>调整记录</title>
    <link href="../../Scripts/easyUI145/themes/default/easyui.css" rel="stylesheet" />
    <link href="../../../DataUser/Style/ccbpm.css" rel="stylesheet" type="text/css" />
    <link href="../../Scripts/bootstrap/css/bootstrap.css" rel="stylesheet" />
    <script type="text/javascript" src="../../Scripts/bootstrap/js/jquery.min.js"></script>
    <script type="text/javascript" src="../../Scripts/QueryString.js"></script>
    <script type="text/javascript" src="../../Scripts/config.js"></script>
    <script type="text/javascript" src="../../Comm/Gener.js"></script>
    <!-- layui -->
    <link href="../../Scripts/layui/layui/css/layui.css" rel="stylesheet" />
    <link href="../../Scripts/layui/style/admin.css" rel="stylesheet" />
    <link href="../../Scripts/layui/layui/css/autocomplete.css" rel="stylesheet" />
    <script src="../../Scripts/layui/layui/layui.js" type="text/javascript"></script>
    <script src="../../Scripts/layui/LayuiDialog.js" type="text/javascript"></script>
    <base target="_self" />
    <style>
    </style>
    <script type="text/javascript">
        //页面启动函数.
        $(function () {
            $("#Msg").html("<img src=../../Img/loading.gif />&nbsp;正在加载,请稍后......");
            InitPage();
            $("#Msg").html("");
        });

        //初始化数据.
        function InitPage() {
            var handler = new HttpHandler("BP.WF.HttpHandler.WF_MyFlow");
            handler.AddUrlData();
            var data = handler.DoMethodReturnString("GetWriteTrack");
            if (data.indexOf("err@") != -1) {
                layer.alert(data);
            }
            debugger;
            data = JSON.parse(data);
            var html = "";
            for (var i = 0; i < data.length; i++) {
                var en = data[i];
                html += "<tr>";
                html += "<td>" + en.EmpFromT + "</td>";
                html += "<td>" + en.RDT + "</td>";
                html += "<td>" + en.Msg + "</td>";
                html += "<td>" + decodeURIComponent(en.NodeData) + "</td>";
                html += "</tr>";
            }
            $("#docs").html(html);
        }

    </script>
</head>
<body>

    <table class="layui-table">
        <colgroup>
            <col width="100">
            <col width="170">
            <col width="350">
            <col>
        </colgroup>
        <thead>
            <tr>
                <th>人员名称</th>
                <th>时间</th>
                <th>消息</th>
                <th>内容</th>
            </tr>
        </thead>
        <tbody id="docs"></tbody>
    </table>

    <div style="position:relative;" id="Msg"></div>

</body>
</html>
